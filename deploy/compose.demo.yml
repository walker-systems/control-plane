# Zero-config local demo. From the repo root:
#
#   docker compose -f deploy/compose.demo.yml up -d
#   open http://localhost:8000       (log in: demo@control-plane.dev / demo-password)
#   ./scripts/seed-demo.sh           (optional: pre-populate schedules + jobs)
#
# Pulls the published images from GHCR — no JDK, Node, or build step
# needed. To build from source instead (e.g. on a fork with no
# published images): add --build to the up command.
#
# Every credential below is a fixed, documented demo value. That is
# deliberate: this file must work with zero setup. Nothing here is
# reachable from outside localhost, and none of these values are used
# by the production deployment (deploy/compose.prod.yml requires a
# real .env).

name: control-plane-demo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: demo-only-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane -d control_plane"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/walker-systems/control-plane-api:latest
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: control_plane
      DB_USERNAME: controlplane
      DB_PASSWORD: demo-only-password
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: demo-only-jwt-secret-not-for-production-use
      EXECUTOR_ENABLED: "true"
      BOOTSTRAP_ENABLED: "true"
      # Same split as production: a private-ish admin, and the shared
      # demo user (OPERATOR) that the login page's "Explore the demo"
      # button signs in as.
      BOOTSTRAP_ADMIN_EMAIL: admin@control-plane.local
      BOOTSTRAP_ADMIN_PASSWORD: demo-admin-password
      BOOTSTRAP_DEMO_EMAIL: demo@control-plane.dev
      BOOTSTRAP_DEMO_PASSWORD: demo-password

  web:
    image: ghcr.io/walker-systems/control-plane-web:latest
    build:
      context: ..
      dockerfile: services/ui/Dockerfile
    depends_on:
      - api
    ports:
      - "${DEMO_PORT:-8000}:80"
    environment:
      # ":80" = plain HTTP, no domain, no certificates — right for
      # localhost. The production Caddyfile branches on this same var.
      DOMAIN: ":80"

volumes:
  postgres_data:
