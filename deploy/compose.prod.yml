# Production stack for a single droplet. Copy this file plus a filled-in
# .env (see .env.prod.example) to /opt/control-plane on the server:
#
#   docker compose pull && docker compose up -d
#
# Only the web container (Caddy) binds host ports. Postgres, Redis,
# RabbitMQ, and the API are reachable solely on the internal compose
# network — nothing to firewall, nothing exposed by accident.

name: control-plane

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-control_plane}
      POSTGRES_USER: ${DB_USERNAME:-controlplane}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-controlplane} -d ${DB_NAME:-control_plane}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/walker-systems/control-plane-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-control_plane}
      DB_USERNAME: ${DB_USERNAME:-controlplane}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # The demo is the whole point of this deployment: executor on so
      # jobs actually run (it defaults false for integration tests),
      # bootstrap on so a fresh droplet has an admin to log in with.
      # Bootstrap is idempotent — it skips if the email already exists.
      EXECUTOR_ENABLED: "true"
      BOOTSTRAP_ENABLED: "true"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
      # Shared demo account (OPERATOR) behind the login page's
      # "Explore the demo" button. The credentials are deliberately
      # public — they're baked into the UI. Set both to empty in .env
      # to disable one-click demo access on a private deployment.
      # Single-dash interpolation (${VAR-default}, not ${VAR:-default})
      # is what makes that disable switch work: it defaults only when
      # the var is UNSET, so an explicit empty value in .env passes
      # through to Spring's isBlank check instead of being replaced
      # by the public default.
      BOOTSTRAP_DEMO_EMAIL: ${BOOTSTRAP_DEMO_EMAIL-demo@control-plane.dev}
      BOOTSTRAP_DEMO_PASSWORD: ${BOOTSTRAP_DEMO_PASSWORD-demo-password}

  web:
    image: ghcr.io/walker-systems/control-plane-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      # Certificates and Caddy state must outlive the container, or
      # every deploy would re-issue certs and eventually hit Let's
      # Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  caddy_data:
  caddy_config:
