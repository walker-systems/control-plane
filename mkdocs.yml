site_name: ControlPlane
site_url: https://walker-systems.github.io/control-plane/
repo_url: https://github.com/walker-systems/control-plane

theme:
  name: material
  features:
    - navigation.tabs

# Render ```mermaid fences as diagrams (mkdocs-material ships the
# integration; GitHub renders the same fences natively, so one syntax
# works in both places).
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture: architecture.md
  - API: api.md
  - Security: security.md
  - Deployment: deployment.md
  - Roadmap: roadmap.md
