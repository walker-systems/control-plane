spring:
  application:
    name: api
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:control_plane}
    username: ${DB_USERNAME:controlplane}
    password: ${DB_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    dev.jwalker.controlplane: ${APP_LOG_LEVEL:INFO}

app:
  scheduler:
    # Pool size for the ThreadPoolTaskScheduler bean in SchedulerConfig.
    # Three @Scheduled ticks today (schedule materializer, executor,
    # watchdog); 5 leaves headroom. See SchedulerConfig for why this
    # is a bean rather than spring.task.scheduling.pool.size (which is
    # ignored when virtual threads are enabled).
    pool-size: ${SCHEDULER_POOL_SIZE:5}
  security:
    jwt-secret: ${JWT_SECRET:replace-this-in-real-env}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    # Optional shared demo account (OPERATOR) for one-click demo login.
    demo-email: ${BOOTSTRAP_DEMO_EMAIL:}
    demo-password: ${BOOTSTRAP_DEMO_PASSWORD:}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
    tick-interval-ms: ${SCHEDULING_TICK_INTERVAL_MS:30000}
    batch-size: ${SCHEDULING_BATCH_SIZE:50}
  executor:
    # Defaults to false so integration tests can seed PENDING rows
    # without the scheduled tick racing them. Local dev and prod
    # should set EXECUTOR_ENABLED=true — the SimulatedWorkHandler
    # subclasses give every JobType a plausible demo behavior
    # (visible RUNNING time, occasional retry, rare DEAD_LETTER).
    enabled: ${EXECUTOR_ENABLED:false}
    tick-interval-ms: ${EXECUTOR_TICK_INTERVAL_MS:5000}
    batch-size: ${EXECUTOR_BATCH_SIZE:10}
  watchdog:
    # Safe to enable by default. Watchdog only touches JobExecution
    # rows whose lease has already expired — if the executor is off,
    # there are no such rows and each tick is a no-op query.
    enabled: ${WATCHDOG_ENABLED:true}
    tick-interval-ms: ${WATCHDOG_TICK_INTERVAL_MS:60000}
    batch-size: ${WATCHDOG_BATCH_SIZE:50}
  demo:
    simulated-handlers:
      # Milliseconds per "chunk" of simulated work. Each handler runs
      # some number of chunks (3–8 depending on type), so total per-job
      # duration lands roughly in the 6–16s range at the default.
      # Set to 0 to short-circuit into instant, guaranteed-success mode
      # — used by integration tests so the suite stays fast and
      # deterministic without needing a separate handler class.
      chunk-millis: ${DEMO_HANDLER_CHUNK_MILLIS:2000}

