name: Deploy

# Build both images, push to GHCR, then SSH to the droplet and roll the
# stack forward. Deploy is skipped (not failed) when the DEPLOY_* secrets
# aren't configured, so image builds keep working before a server exists.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # The secrets context can't be referenced in `if:` conditionals
    # (per GitHub's docs) — but it IS valid in job-level env. Surface
    # the host there and gate the steps on the env var: missing secret
    # → empty env → the steps no-op and the job stays green.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Checkout
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: actions/checkout@v4

      # Keep the droplet's compose file in lockstep with the repo —
      # `docker compose pull` only refreshes images, so without this,
      # compose changes (new env vars, services, ports) would silently
      # never reach the server.
      - name: Sync compose file to droplet
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/compose.prod.yml
          target: /opt/control-plane/
          strip_components: 1

      - name: Roll the droplet forward
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/control-plane
            cp -f compose.prod.yml compose.yml
            docker compose pull
            docker compose up -d
            docker image prune -f
